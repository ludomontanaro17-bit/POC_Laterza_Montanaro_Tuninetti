# docker-compose.yml (rimuovi la riga version)
# version: '3.8'  # <-- Rimuovi questa riga

services:
  loan-api:
    build:
      context: .           # directory del progetto
      dockerfile: Dockerfile
    container_name: loan_api
    ports:
      - "5000:5000"        # mappa la porta Flask
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app    # garantisce gli import dai moduli classes/
    volumes:
      - ./model:/app/model # monta la cartella dei modelli (per aggiornare scaler o .keras senza rebuild)
    command: python app/API.py
    # Aggiungi questa dipendenza per assicurarti che Prometheus parte prima
    depends_on:
      - prometheus
      - grafana

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      # Monta il file di configurazione di Prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    # image: grafana/grafana-enterprise:latest  # <-- Immagine sbagliata/commentata
    image: grafana/grafana-oss:latest          # <-- Usa questa immagine OSS (Open Source Software)
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    environment:
      # Credenziali di default (puoi cambiarle)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Monta un volume per persistere i dashboard e le configurazioni
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped
    # Grafana dipende da Prometheus per ottenere i dati
    depends_on:
      - prometheus

volumes:
  # Definisce un volume Docker per Grafana
  grafana-storage: